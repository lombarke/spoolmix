name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # Headless Chrome for tests/test_browser.py, which clicks through the web UI and
      # fails on any JavaScript error or failed request. SPOOLMIX_E2E=1: no browser = fail.
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
        env:
          SPOOLMIX_E2E: "1"

  image:
    # Publishes ghcr.io/<owner>/spoolmix for amd64 and arm64 (e.g. Raspberry Pi):
    # :latest and :sha-<commit> from main, :<version> and :<major>.<minor> from v* tags,
    # and :dev from the dev branch (for a staging instance; users on :latest don't get it).
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/spoolmix
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
