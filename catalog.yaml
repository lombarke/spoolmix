# spoolmix purchase catalog: filaments `spoolmix match --shop` may suggest buying.
#
# Edit freely. Fields per item:
#   id          unique slug (required)
#   brand, material, color_name   used to fill TD from td_database.yaml
#   hex         sRGB color (required)
#   td          leave blank to fill from td_database.yaml (high-confidence matches only)
#   bundle      optional group label, e.g. a multi-spool pack
#   url, price, notes   optional, shown in output
#   enabled     set false to hide an item without deleting it
#
# Extra local catalogs (e.g. from `spoolmix catalog import-spoolmandb`) live in
# data/catalog.*.local.yaml and are merged in automatically.
schema_version: 1
items:
