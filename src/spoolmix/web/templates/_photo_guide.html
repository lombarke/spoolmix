{# How to photograph a row of calibration blocks: top view and side view. Theme-aware (CSS variables). #}
<figure class="photoguide" aria-label="How to photograph a row of blocks">
  <svg viewBox="0 0 480 190" role="img" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="pg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="var(--accent)"/>
      </marker>
      <g id="pg-cam"><rect x="-17" y="-11" width="34" height="22" rx="4" fill="var(--ink)"/>
        <circle r="7" fill="var(--panel)"/><circle r="4" fill="var(--ink)"/><rect x="-10" y="-15" width="9" height="5" rx="1.5" fill="var(--ink)"/></g>
    </defs>
    <!-- top view -->
    <text x="12" y="16" font-size="11" font-weight="700" fill="var(--ink)">From above</text>
    <rect x="12" y="24" width="250" height="96" rx="6" fill="#fff" stroke="var(--line)"/>
    <text x="20" y="38" font-size="9" fill="#8a8f98" font-style="italic">white paper</text>
    <g font-size="8" font-weight="700" text-anchor="middle" fill="#222">
      <rect x="30" y="52" width="30" height="30" rx="2" fill="#39D0F1"/><text x="45" y="70">A1</text>
      <rect x="70" y="52" width="30" height="30" rx="2" fill="#F6FA00"/><text x="85" y="70">A2</text>
      <rect x="110" y="52" width="30" height="30" rx="2" fill="#6BF276"/><text x="125" y="70">A3</text>
      <rect x="150" y="52" width="30" height="30" rx="2" fill="#82F94F"/><text x="165" y="70">A4</text>
      <rect x="190" y="52" width="30" height="30" rx="2" fill="#9DFC33"/><text x="205" y="70">A5</text>
    </g>
    <text x="24" y="100" font-size="9" fill="#8a8f98">label order, labels up,</text>
    <text x="24" y="111" font-size="9" fill="#8a8f98">fronts toward the camera</text>
    <path d="M150 160 L150 88" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#pg-arrow)"/>
    <use href="#pg-cam" x="150" y="170"/>
    <text x="174" y="174" font-size="9.5" fill="var(--accent)" font-weight="600">20–30 cm, straight on</text>
    <!-- side view -->
    <text x="290" y="16" font-size="11" font-weight="700" fill="var(--ink)">From the side</text>
    <path d="M296 150 L430 150 Q458 150 458 122 L458 30" fill="none" stroke="var(--line)" stroke-width="3"/>
    <text x="410" y="44" font-size="9" fill="#8a8f98" font-style="italic" text-anchor="end">paper curves up</text>
    <text x="410" y="55" font-size="9" fill="#8a8f98" font-style="italic" text-anchor="end">behind the blocks</text>
    <rect x="395" y="118" width="32" height="32" fill="#82F94F" stroke="#00000033"/>
    <rect x="404" y="114" width="14" height="4" fill="#555"/>
    <use href="#pg-cam" x="318" y="124" transform="rotate(12 318 124)"/>
    <path d="M338 128 L388 136" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#pg-arrow)"/>
    <text x="296" y="78" font-size="9.5" fill="var(--accent)" font-weight="600">level with the blocks,</text>
    <text x="296" y="90" font-size="9.5" fill="var(--accent)" font-weight="600">tilted down a little</text>
    <text x="296" y="170" font-size="9" fill="#8a8f98">daylight from a window,</text>
    <text x="296" y="182" font-size="9" fill="#8a8f98">no flash, no direct sun</text>
  </svg>
</figure>
